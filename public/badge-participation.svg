<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006633;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00EF8B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Hexagon badge shape -->
  <polygon points="100,8 185,55 185,145 100,192 15,145 15,55" fill="url(#bg)"/>
  <polygon points="100,18 175,61 175,139 100,182 25,139 25,61" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Hand/vote icon -->
  <text x="100" y="90" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">🗳️</text>
  <text x="100" y="128" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">CIVIC</text>
  <text x="100" y="147" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#00EF8B" text-anchor="middle" letter-spacing="1">PARTICIPATION</text>
  <!-- Nigeria green stripe -->
  <rect x="40" y="158" width="120" height="3" fill="#008751" rx="1.5"/>
</svg>
