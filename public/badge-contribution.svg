<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00EF8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circle base -->
  <circle cx="100" cy="100" r="92" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#FFD700" stroke-width="3" stroke-opacity="0.7"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FFD700" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Star -->
  <polygon points="100,30 112,68 152,68 120,90 132,128 100,106 68,128 80,90 48,68 88,68" fill="url(#star)"/>
  <text x="100" y="158" font-family="Arial Black, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">OUTSTANDING</text>
  <text x="100" y="174" font-family="Arial, sans-serif" font-size="10" fill="#FFD700" text-anchor="middle" letter-spacing="1">CONTRIBUTION</text>
</svg>
